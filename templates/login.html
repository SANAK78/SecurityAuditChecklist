<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditor Clearance Gateway | Security Audit Sentinel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #040711;
            --card-surface: rgba(13, 22, 41, 0.78);
            --border-subtle: rgba(56, 189, 248, 0.18);
            --accent-cyan: #38bdf8;
            --accent-blue: #3b82f6;
            --text-heading: #f8fafc;
            --text-secondary: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #0c1833, #040711 65%);
            color: var(--text-heading);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 38px 32px;
            backdrop-filter: blur(25px);
            box-shadow: 0 35px 80px -20px rgba(0,0,0,0.85);
            text-align: center;
        }
        .brand-badge {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            border-radius: 18px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
        }
        h1 { font-size: 1.55rem; font-weight: 800; margin-bottom: 6px; }
        p.sub { font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 22px; }
        .error-alert {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            padding: 10px 14px;
            border-radius: 12px;
            color: #fca5a5;
            font-size: 0.82rem;
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group { text-align: left; margin-bottom: 16px; }
        label { display: block; font-size: 0.76rem; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(6, 9, 19, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        input:focus { border-color: var(--accent-cyan); }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            box-shadow: 0 6px 20px -3px rgba(56, 189, 248, 0.4);
        }
        .credentials-hint {
            margin-top: 22px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.08);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            color: #64748b;
            text-align: left;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-badge">
            <svg width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        </div>
        <h1>Security <span style="color: var(--accent-cyan);">Audit Gate</span></h1>
        <p class="sub">Certified Auditor Verification</p>

        {% if error %}
        <div class="error-alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>AUDITOR IDENTITY</label>
                <input type="text" name="username" placeholder="auditor_secops" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>CLEARANCE PASSPHRASE</label>
                <input type="password" name="password" placeholder="••••••••••••" required>
            </div>
            <button type="submit">AUTHORIZE AUDIT SESSION</button>
        </form>

        <div class="credentials-hint">
            <strong>DEMO CLEARANCE CREDENTIALS:</strong><br>
            User: <code>auditor_secops</code> | Pass: <code>Shield@Auditor2026</code>
        </div>
    </div>
</body>
</html>
